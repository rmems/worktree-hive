# Qodana static analysis for the Python package under python/.
#
# Hardening (aligned with python.yml / security.yml):
# - SHA-pinned actions with version comments
# - Default contents: read; job grants write only for Qodana check/PR reporting
# - concurrency cancel-in-progress
# - persist-credentials: false before pip install -e (untrusted packaging)
# - QODANA_TOKEN only on non-pull_request (trusted refs); PR scans run without cloud secret
# - paths filter: only when Python or this workflow changes (docs-only PRs skip)
# - Fork PRs never receive secrets; PR path intentionally has empty token (local/community scan)
name: Qodana

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/qodana_code_quality.yml"
  push:
    branches:
      - main
      - "releases/*"
    paths:
      - "python/**"
      - ".github/workflows/qodana_code_quality.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-latest
    # Qodana action posts check runs / PR quality comments; not contents write.
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # PR head when present; otherwise the event SHA (push / workflow_dispatch).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # full history for PR analysis
          # Do not leave the job token in .git: pip install -e runs PR packaging code.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup-python
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        working-directory: python
        run: pip install -e ".[test]"

      - name: Qodana Scan
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891 # v2026.1.3
        with:
          # PR-delta analysis only on pull_request; full scan on push/dispatch.
          pr-mode: ${{ github.event_name == 'pull_request' }}
          # Space-separated args (comma-separated form is deprecated by qodana-action).
          # Force community linter + project-dir so scan args are workflow-controlled.
          args: --linter qodana-python-community --project-dir=python --within-docker=false
        env:
          # Never inject the cloud token into PR jobs: checkout head can control
          # qodana.yaml bootstrap. Token only for push/workflow_dispatch (trusted refs).
          # Fork PRs never receive repository secrets; empty token is intentional.
          QODANA_TOKEN: ${{ github.event_name != 'pull_request' && secrets.QODANA_TOKEN_1561455798 || '' }}
          QODANA_ENDPOINT: "https://qodana.cloud"
          QODANA_PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
          JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow
